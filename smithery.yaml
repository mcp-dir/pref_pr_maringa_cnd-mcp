name: pref_pr_maringa_cnd-mcp
displayName: "Prefeitura PR Maringá: Certidão Negativa de Débitos (Contribuinte)"
description: >
  Prefeitura PR Maringá: Certidão Negativa de Débitos (Contribuinte), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pref_pr_maringa_cnd-mcp
repository: https://github.com/mcp-dir/pref_pr_maringa_cnd-mcp

tags:
  - pref_pr_maringa_cnd
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pref_pr_maringa_cnd

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pref_pr_maringa_cnd/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
